    <circle cx="125" cy="125" r="34" fill="url(#g)"/>
    <circle cx="125" cy="125" r="13" fill="#fff"/>
    <circle cx="46" cy="78" r="9" fill="#7C3AED"/>
    <circle cx="205" cy="53" r="7" fill="#2563EB"/>
